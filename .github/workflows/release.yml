name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build binary (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: aarch64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ github.ref_name }}               # e.g. v1.2.3
      OPENROT_VERSION: ${{ github.ref_name }}       # passed to poetry-dynamic-versioning
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.3"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install versioning plugin
        run: poetry self add "poetry-dynamic-versioning[plugin]"

      - name: Install dependencies
        run: poetry install

      - name: Show tagged version
        run: poetry run python -c "import importlib.metadata as m; print('building version:', m.version('openrot'))"

      - name: Build standalone binary (PyInstaller)
        run: poetry run pyinstaller --noconfirm --clean openrot.spec

      - name: Package tarball
        run: |
          cd dist/openrot
          tar -czf ../openrot-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openrot-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/openrot-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: binaries
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/vispar-tech/openrot
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENROT_VERSION=${{ env.VERSION }}

  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [binaries, docker]
    timeout-minutes: 10
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: openrot-*

      - name: Flatten downloads into artifacts/
        run: |
          mkdir -p artifacts
          find . -name 'openrot-*.tar.gz' -type f -exec cp -n {} artifacts/ \;

      - name: Generate checksums
        working-directory: artifacts
        run: |
          shasum -a 256 openrot-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: openrot ${{ env.VERSION }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/openrot-*.tar.gz
            artifacts/SHA256SUMS

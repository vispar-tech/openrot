name: CI

on:
  push:

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.3"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            .venv
            poetry.lock
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Ruff lint
        run: poetry run pre-commit run ruff-lint -a
      - name: Ruff format
        run: poetry run pre-commit run ruff-format -a

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.3"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            .venv
            poetry.lock
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Mypy
        run: poetry run pre-commit run mypy -a

  tests:
    name: Tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.3"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            .venv
            poetry.lock
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Run tests with coverage (fails if below threshold)
        run: poetry run pytest --cov=openrot --cov-fail-under=75
      - name: Run integration tests (best-effort, may skip)
        run: poetry run pytest tests/integration -m integration --no-cov -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t openrot .
      - name: Smoke test
        run: docker run --rm openrot --version